# Runs the API with PostgreSQL:  docker compose up --build
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 2s
      retries: 30
    volumes:
      - db-data:/var/lib/postgresql

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: tickets
      DATABASE_PASSWORD: tickets
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db-data:

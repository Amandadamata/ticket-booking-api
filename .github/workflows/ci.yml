name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Java 25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and run all tests against PostgreSQL 18
        run: ./mvnw -B verify

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t ticket-booking-api .
      - name: Start the API with PostgreSQL and check health
        run: |
          docker compose up -d --build --wait db
          docker compose up -d api
          for i in $(seq 1 60); do
            curl -fs http://127.0.0.1:8080/actuator/health && exit 0
            sleep 2
          done
          docker compose logs api
          exit 1
      - name: Stop
        if: always()
        run: docker compose down -v
